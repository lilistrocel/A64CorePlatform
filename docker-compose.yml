version: '3.8'

services:
  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - MONGODB_URL=mongodb://mongodb:27017/?replicaSet=rs0
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-a64core_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redispassword}@redis:6379
      # Host that printed label QR codes point at (T-804). Must be reachable
      # from a phone camera, so LAN testing sets this to http://<lan-ip>.
      # NO fallback default here on purpose: every deployment must declare
      # its own value in .env, or genetics label printing fails loudly at
      # the point of use (src/modules/genetics/api/v1/labels.py) rather than
      # silently inheriting some other deployment's host. See .env.example.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      # Host used to build links in outgoing emails — account verification
      # and password reset (src/utils/email.py). Wrong value means every
      # recovery email points at the wrong place, but (unlike
      # PUBLIC_BASE_URL above) it is fixable after the fact by editing .env
      # and recreating: no physical artifact bakes it in. Falling back to
      # localhost:3000 is safe under the no-real-deployment-default policy
      # (commit 75820b2) because it names nothing real; it just means
      # emails sent before .env is configured contain a dead link instead
      # of leaking another deployment's host.
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      # Cloudflare Access. These resolve env -> db -> unset
      # (src/services/deployment_settings_service.py): a value set here is
      # authoritative and renders read-only in Settings -> Deployment, which is
      # how a hardened deployment pins auth config outside the database.
      # They were absent from this block entirely, so that env layer could
      # never engage and the "env acts as a lock" behaviour was unreachable —
      # the same missing-wiring shape as FRONTEND_URL above, masked because
      # the DB fallback still worked.
      #
      # NOTE THE SYNTAX: bare names, no `=`. Compose passes these through only
      # when they are actually defined, and omits them entirely otherwise.
      # `${VAR:-}` would be wrong twice over: it sets an EMPTY STRING, which
      # (a) fails Pydantic bool parsing for the three flags below and crashes
      # the API at boot, and (b) for a non-empty default like `false` would be
      # treated as "env is set" by deployment_settings_service.get_resolved(),
      # locking the key read-only and overriding whatever an admin configured
      # in Settings -> Deployment. On a deployment running Cloudflare Access
      # from the database that would silently disable its own sign-in.
      - CF_ACCESS_ENABLED
      - CF_ACCESS_TEAM_DOMAIN
      - CF_ACCESS_AUD
      - CF_ACCESS_EXCLUSIVE
      - CF_ACCESS_JIT_PROVISION
      - CF_ACCESS_DEFAULT_ROLE
      - LICENSE_VALIDATION_MODE=format  # Format-only validation for development
      - LICENSE_ENCRYPTION_KEY=dev-encryption-key-32-chars-minimum-a  # Required for module license encryption (minimum 32 characters)
      - TRUSTED_REGISTRIES=registry.hub.docker.com,ghcr.io,gcr.io,docker.io,localhost,localhost:5000
      - PYTHONPATH=/app/src:/app
      # Google Vertex AI Settings (AI Analytics)
      - GOOGLE_CLOUD_PROJECT=a64core
      - GOOGLE_APPLICATION_CREDENTIALS=/app/.credentials/vertex-ai-service-account.json
      - VERTEX_AI_LOCATION=us-central1
      - VERTEX_AI_MODEL=gemini-2.5-flash
      - VERTEX_AI_MAX_OUTPUT_TOKENS=2048
      - VERTEX_AI_TEMPERATURE=0.1
      # Anthropic Claude AI (Farm AI Chat)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      # WeatherBit API Settings (Agricultural Weather Data)
      - WEATHERBIT_API_KEY=${WEATHERBIT_API_KEY:-}
      - WEATHERBIT_ENABLED=true
      # ElevenLabs TTS
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      # Admin seed (auto-creates super_admin on first startup if none exists)
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@a64platform.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-SuperAdmin123!}
      # Uvicorn worker configuration (production: 2 * CPU cores + 1)
      - UVICORN_WORKERS=${UVICORN_WORKERS:-4}
      # Finance outbox bridge — set true when finance service is deployed
      - FINANCE_OUTBOX_ENABLED=${FINANCE_OUTBOX_ENABLED:-false}
    volumes:
      - ./src:/app/src
      - ./contracts:/app/contracts  # Shared finance event schemas (read by OutboxWriter)
      - ./public:/app/public  # Admin panel static files
      - ./modules:/app/modules  # Farm management and other modules
      - ./config:/app/config
      # Migrations are executed with `docker compose exec api python
      # scripts/migrations/...` (see .github/workflows/ops-only-smoke.yml and
      # Docs/1-Main-Documentation/Deployment-Modes.md), but the Dockerfile only
      # COPYs src/ and public/ — so without this mount that command fails with
      # "No such file or directory" and the Wave 0 migration can never run.
      # Read-only: nothing should write into scripts/ at runtime.
      - ./scripts:/app/scripts:ro
      - ./logs:/app/logs  # Centralized logging
      - ./.credentials:/app/.credentials  # Google Cloud credentials for Vertex AI
      - ./data/sensehub_images:/app/data/sensehub_images  # Camera snapshot storage
      - ./data/attachments:/app/data/attachments  # Document attachment storage (T-053)
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket for module management
      - nginx_modules_config:/etc/nginx/conf.d/modules  # Shared volume for module proxy configs
    user: "0:0"  # Run as root to access Docker socket (CRITICAL for module management)
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - a64core-network
    healthcheck:
      # NOT curl — it is not installed in this image, so the old
      # `curl -f http://localhost:8000/api/health` check could never pass
      # (it failed 201 times in a row, reporting the container unhealthy
      # while the API was serving fine). Python is guaranteed present here.
      # 127.0.0.1, not localhost: /etc/hosts maps localhost to ::1 as well,
      # and uvicorn binds IPv4 only.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Resource limits for development (can be overridden in prod)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_DATABASE=${MONGODB_DB_NAME:-a64core_db}
      - MONGO_APP_USER=${MONGO_APP_USER:-a64core_app}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD:-changeme_in_production}
    # MongoDB wiredTiger cache: 50% of memory limit (1.5GB of 3GB = ~1.5GB cache)
    # Default is (RAM - 1GB) / 2, but we explicitly set for container environment.
    # --replSet rs0 enables single-node replica set mode (required for multi-document
    # transactions used by the finance-bridge transactional outbox). Initiate once
    # with: rs.initiate({_id:"rs0", members:[{_id:0, host:"mongodb:27017"}]})
    command: ["mongod", "--wiredTigerCacheSizeGB", "1.5", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      # Bind-mount for data (survives compose project rename + visible in repo). Migrated 2026-05-19.
      # Was: mongodb_data:/data/db (named volume — kept defined below for emergency rollback).
      - ./data/mongodb:/data/db
      - mongodb_config:/data/configdb
      - ./logs/mongodb:/var/log/mongodb  # MongoDB logs
    networks:
      - a64core-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Redis - Caching and Rate Limiting
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redispassword}
    # Redis maxmemory: 256MB with allkeys-lru eviction policy
    # Prevents unbounded memory growth and evicts least-recently-used keys when full
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - a64core-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # NGINX - Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ${NGINX_CONF:-./nginx/nginx.dev.conf}:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
      - ./nginx/conf.d:/etc/nginx/conf.d:ro  # Module proxy configs (bind mount for easy development)
    networks:
      - a64core-network
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M

  # Adminer - Database Management UI
  adminer:
    image: adminer:latest
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - a64core-network
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'healthy';"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - mongodb

  # Local Docker Registry - For Module Images
  registry:
    image: registry:2
    ports:
      - "${REGISTRY_PORT:-5050}:5000"
    environment:
      - REGISTRY_STORAGE_DELETE_ENABLED=true
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - a64core-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/v2/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # User Portal (Frontend) - Development Mode
  user-portal:
    build:
      context: .
      dockerfile: frontend/user-portal/Dockerfile
      target: development  # Use development stage
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}  # Build-time API URL
    ports:
      - "${USER_PORTAL_PORT:-5173}:5173"  # Vite dev server
    environment:
      - NODE_ENV=development
      - VITE_API_URL=${VITE_API_URL:-/api}  # Runtime API URL
      - VITE_API_TARGET=http://api:8000  # Proxy target for Vite dev server (Docker network)
    volumes:
      - ./frontend/shared:/app/shared  # Hot-reload for shared library
      - ./frontend/user-portal/src:/app/user-portal/src  # Hot-reload for user-portal source
      - ./frontend/user-portal/public:/app/user-portal/public
      - ./frontend/user-portal/index.html:/app/user-portal/index.html
      - ./frontend/user-portal/vite.config.ts:/app/user-portal/vite.config.ts
      # Exclude node_modules from volume (use container's)
      - /app/node_modules
      - /app/shared/node_modules
      - /app/user-portal/node_modules
    networks:
      - a64core-network
    healthcheck:
      # 127.0.0.1, not localhost: /etc/hosts maps localhost to both 127.0.0.1
      # and ::1, BusyBox wget tries the IPv6 address first, and Vite binds
      # IPv4 only (0.0.0.0:5173) — so `localhost` returned "Connection
      # refused" and the container reported unhealthy while serving fine.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Cron Service - Automated Tasks
  cron:
    build:
      context: ./cron
      dockerfile: Dockerfile
    environment:
      - TZ=UTC  # Timezone for cron (11 PM UTC = 11 PM UTC)
      - API_HOST=api:8000
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@a64platform.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-SuperAdmin123!}
      # --- Finance outbox reconciler settings ---
      # MONGODB_URL and MONGODB_DB_NAME allow the Python sweeper to connect
      # directly to Mongo without going through the API HTTP layer.
      - MONGODB_URL=mongodb://mongodb:27017/?replicaSet=rs0
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-a64core_db}
      # FINANCE_OUTBOX_ENABLED must match the api service setting.
      # When false the sweeper exits cleanly on every run (no-op).
      - FINANCE_OUTBOX_ENABLED=${FINANCE_OUTBOX_ENABLED:-false}
      # PYTHONPATH makes src/ and contracts/ importable from /app.
      - PYTHONPATH=/app/src:/app
    volumes:
      - ./logs/cron:/var/log/cron
      # Mount src/ and contracts/ so the Python sweeper can import
      # OutboxWriter and the payload builders without duplication.
      - ./src:/app/src
      - ./contracts:/app/contracts
      - ./cron/scripts:/app/cron/scripts
    networks:
      - a64core-network
    depends_on:
      - api
      - mongodb
    healthcheck:
      test: ["CMD", "pgrep", "-x", "crond"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # IoT Simulator - Simulates greenhouse sensors and relays for testing
  iot-simulator:
    build:
      context: ./services/iot-simulator
      dockerfile: Dockerfile
    ports:
      - "${IOT_SIM_PORT:-8090}:8090"
    networks:
      - a64core-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backup Service - Automated MongoDB backups with retention policy
  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB=${MONGODB_DB_NAME:-a64core_db}
      - MONGO_USER=${MONGO_APP_USER:-a64core_app}
      - MONGO_PASSWORD=${MONGO_APP_PASSWORD:-changeme_in_production}
      - MONGO_AUTH_DB=admin
      - BACKUP_DIR=/backups/mongodb
      - LOG_FILE=/var/log/backup/mongodb_backup.log
      - BACKUP_RETENTION_DAILY=${BACKUP_RETENTION_DAILY:-7}
      - BACKUP_RETENTION_WEEKLY=${BACKUP_RETENTION_WEEKLY:-4}
      - BACKUP_RETENTION_MONTHLY=${BACKUP_RETENTION_MONTHLY:-3}
      - ENCRYPT_BACKUPS=${ENCRYPT_BACKUPS:-false}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      - TZ=UTC
    volumes:
      - backup_data:/backups
      - ./scripts/backup:/scripts:ro
      - ./logs/backup:/var/log/backup
    networks:
      - a64core-network
    depends_on:
      mongodb:
        condition: service_healthy
    profiles:
      - backup
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  a64core-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  registry_data:
    driver: local
  nginx_modules_config:
    driver: local
  backup_data:
    driver: local
