name: Ops-Only Smoke (Wave 0)

# T-059.6 — runs the import-boundary lint that blocks accidental coupling
# from src/ to services/finance/, keeping the operations app able to stand
# on its own.
#
# The "Ops-only Docker stack — PR/PO/GR/AP smoke" job that used to live here
# was removed on 2026-08-19. It cost ~25 minutes on EVERY pull request, and
# its browser step could neither fail nor test anything:
#
#     npx playwright test --project=chromium tests/ops-only-smoke || true
#
# `frontend/user-portal/tests/ops-only-smoke` has never existed in this repo,
# and `|| true` swallowed the resulting error. Because playwright.config.ts
# IS present, the curl-based fallback the step was written to use never ran
# either. The bulk of the runtime was the `npm ci` of the whole frontend
# workspace (plus a sudo chown to reclaim node_modules dirs left root-owned
# by the stack's anonymous volumes) done purely to support that no-op.
#
# What genuinely was covered and is NOT covered any more: the stack booting
# without the finance overlay, backend health, `seed_admin` + the Wave 0
# migration running clean, and the finance proxy returning 503 in ops-only
# mode. If that coverage is wanted back, restore this job from git history
# and write the tests/ops-only-smoke suite — do not restore it with the
# `|| true` no-op.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  import-boundary-lint:
    name: Import boundary — src/ must not import from services/finance/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block `from services.finance` in src/
        run: bash scripts/ci/check_finance_imports.sh
