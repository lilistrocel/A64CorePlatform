name: Build & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-build:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # The `|| true` that used to terminate this line meant the suite could
        # never fail the build — the same dead-check pattern as the old
        # `tsc --noEmit || true` below. Tests ran, output was printed, and the
        # result was discarded, so CI has never actually gated on them.
        # Now the exit status is real, but marked continue-on-error while two
        # known failures in tests/unit/test_finance_bridge/test_outbox_reconciler.py
        # (in-flight finance-outbox work) are outstanding. Drop
        # `continue-on-error` once those are fixed so this starts blocking.
        run: |
          pip install pytest pytest-asyncio pytest-cov
          python -m pytest tests/ -v --tb=short --cov=src --cov-report=term-missing
        continue-on-error: true
        env:
          ENVIRONMENT: development
          MONGODB_URL: mongodb://localhost:27017
          MONGODB_DB_NAME: a64core_test_db
          SECRET_KEY: test_secret_key_for_ci

      - name: Build Docker image
        run: docker build -t a64core-api:ci .

  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        # frontend/ is the npm workspace ROOT (workspaces: shared, user-portal).
        # user-portal has no package-lock.json of its own — only the root does —
        # so install must happen here, not in the member directory.
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Was frontend/user-portal/package-lock.json, which has never existed
          # in any checkout. setup-node failed with "Some specified paths were
          # not resolved, unable to cache dependencies" and took the whole job
          # down with it — every run since at least 2026-05 was red for this.
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        # Runs from the MEMBER, not the workspace root: `tsc -b` at frontend/
        # dies on the root tsconfig's project-references setup (TS6310 "shared
        # may not disable emit" / TS6306 "user-portal must have composite:
        # true") without ever typechecking a line. That root config is broken
        # independently of CI and is worth fixing separately.
        working-directory: frontend/user-portal
        # NOT `tsc --noEmit` — that is a no-op in this repo, and the old
        # `|| true` swallowed failures anyway, so this step could never fail no
        # matter how broken the types were.
        # Non-blocking for now: ~235 pre-existing errors. Drop
        # `continue-on-error` once that reaches zero so this actually gates.
        run: npx tsc -b
        continue-on-error: true

      - name: Build
        run: npm run build --workspace user-portal
        env:
          VITE_API_URL: http://localhost/api

  docker-compose-check:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate production compose
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
