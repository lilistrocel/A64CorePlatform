# Worker processes: auto = number of CPU cores available to container
# For dev environment with limited resources, use auto
worker_processes auto;

# Worker rlimit: max open files per worker
worker_rlimit_nofile 65535;

events {
    worker_connections 1024;
    # Use epoll for Linux (more efficient than select/poll)
    use epoll;
    # Accept multiple connections at once
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml
        font/woff2;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost http://127.0.0.1 https://api.weatherbit.io https://cloudflareinsights.com; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Timeouts
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;

    # Docker's embedded DNS resolver — REQUIRED so nginx re-resolves backend
    # hostnames at request time rather than caching the IP at startup. Without
    # this, recreating any backend container (api, user-portal, finance, …)
    # leaves nginx pointing at a stale IP and returning 502 until nginx itself
    # is restarted.
    #
    # 10s validity is a small TTL so failovers within ~10s of a recreate.
    # ipv6=off because Docker's bridge networks don't expose AAAA records for
    # service names, and resolver would log noise trying them.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Note: no upstream {} blocks. Those resolve once at config load and then
    # cache forever. We use variable-form proxy_pass below to force per-request
    # DNS resolution via the resolver above.

    # Development Server (HTTP only)
    server {
        listen 80;
        server_name localhost 127.0.0.1 a64core.com www.a64core.com _;

        # Client body size limit (for file uploads)
        client_max_body_size 100M;

        # Health check endpoint (for Docker health checks)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Finance service endpoints (routed before general /api/ block).
        #
        # Wave 0 — when the finance container isn't deployed (ops-only
        # mode) or briefly unreachable, intercept the upstream 502/504
        # and return a JSON-shaped 503 instead. The frontend already
        # handles 503 via the capability endpoint + amber banner.
        location /api/v1/finance/ {
            set $finance_backend "http://finance:8001";
            proxy_pass $finance_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;

            # Quick-fail so brief outages don't block requests for long
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;

            # Translate upstream-unreachable codes into a 503 + JSON
            proxy_intercept_errors on;
            error_page 502 503 504 = @finance_unavailable;
        }

        # Named location: served when the finance upstream is missing
        # or unhealthy. Returns the same shape across dev and prod.
        location @finance_unavailable {
            add_header Content-Type application/json always;
            return 503 '{"detail":"Finance module not available","module":"finance"}';
        }

        # API endpoints
        location /api/ {
            set $api_backend "http://api:8000";
            proxy_pass $api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Admin interface
        location /admin/ {
            set $api_backend "http://api:8000";
            proxy_pass $api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # User Portal - Main Frontend Application (Vite dev server)
        location / {
            set $user_portal_backend "http://user-portal:5173";
            proxy_pass $user_portal_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Vite HMR WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # WebSocket support (for future API use)
        location /ws/ {
            set $api_backend "http://api:8000";
            proxy_pass $api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Include module proxy configs
        include /etc/nginx/conf.d/modules/*.conf;
    }
}
