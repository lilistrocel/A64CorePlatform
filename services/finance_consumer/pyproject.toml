[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-consumer"
version = "0.1.0"
description = "A64 Finance — outbox consumer worker"
requires-python = ">=3.11"

dependencies = [
    # MongoDB async driver — pinned to match main app to avoid motor/pymongo
    # incompatibility (newer pymongo dropped _QUERY_OPTIONS that motor imports).
    "motor==3.6.0",
    "pymongo==4.9.2",
    # HTTP client with retry support
    "httpx==0.27.0",
    # Shared contracts
    "a64-finance-contracts @ file:///app/contracts",
    # Pydantic settings
    "pydantic-settings==2.3.4",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.2",
    "pytest-asyncio==0.23.8",
    "pytest-mock==3.14.0",
    "httpx==0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]
